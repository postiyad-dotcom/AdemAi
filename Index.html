<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive AI Assistant</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for better chat aesthetics */
        :root {
            /* Professional color definitions */
            --ai-system-color: #0F172A; /* Slate 900 */
            --user-primary-color: #3B82F6; /* Blue 500 */
            --font-inter: "Inter", sans-serif;
        }

        body {
            font-family: var(--font-inter);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        /* Base Dark/Light Theme Setup */
        .light body {
            background-color: #F8FAFC; /* Slate-50 */
        }
        .dark body {
            background-color: #111827; /* Gray-900 */
        }

        /* Main chat container for mobile responsiveness */
        #chat-container {
            width: 100%;
            max-width: 700px; /* INCREASED SIZE HERE */
            height: 90vh;
            display: flex;
            flex-direction: column;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Chat window styling */
        #chat-window {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Message bubble styling */
        .message-bubble {
            max-width: 90%;
            padding: 0.8rem 1.2rem;
            border-radius: 1.5rem;
            margin-bottom: 1rem;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        /* User messages (Clean Blue Accent) */
        .user-message {
            background-color: var(--user-primary-color);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0.5rem;
        }

        /* AI messages (Neutral System Output) */
        .ai-message {
            /* Light Mode */
            background-color: #F1F5F9; /* Slate 100 */
            color: #1E293B; /* Slate 800 */
            margin-right: auto;
            border-bottom-left-radius: 0.5rem;
        }
        /* AI messages Dark Mode Override */
        .dark .ai-message {
            background-color: #374151; /* Gray 700 */
            color: #F3F4F6; /* Gray 100 */
        }

        /* Source links styling for AI bubbles */
        .sources-container {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            font-size: 0.7rem;
            line-height: 1.2;
            color: #64748B; /* Slate 500 */
        }
        .dark .sources-container {
             border-top: 1px solid rgba(255, 255, 255, 0.1);
             color: #D1D5DB; /* Gray 300 */
        }
        .sources-container a {
            text-decoration: underline;
            margin-right: 0.5rem;
            font-weight: 500;
        }
        .dark .sources-container a {
             color: #93C5FD; /* Blue 300 */
        }
    </style>
</head>
<!-- Apply base theme classes to body/html -->
<body class="transition-colors duration-300">
    <div id="chat-container" class="bg-white dark:bg-gray-800">
        <!-- Header: Clean, professional dark background -->
        <header class="bg-slate-900 dark:bg-gray-900 p-4 shadow-xl flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Logo Image Placeholder -->
                <!-- The actual uploaded image (image_fb5ade.png) needs to be converted to a Base64 Data URI 
                     and placed in the 'src' attribute below to be fully embedded. 
                     For example: data:image/png;base64,...YOUR_BASE64_DATA... -->
                <img src="https://placehold.co/32x32/6366F1/ffffff/png?text=AI" alt="AI Logo" class="h-8 w-8 rounded-lg shadow-md" />
                <h1 class="text-xl font-semibold text-white">
                    Executive Assistant
                </h1>
            </div>
            <div class="flex items-center space-x-3">
                <button id="settings-button" class="text-gray-400 hover:text-white transition duration-150" aria-label="Open Settings">
                    <!-- Settings Icon: modern SVG gear icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                      <path fill-rule="evenodd" d="M11.071 19.902a.75.75 0 0 1-.858.858L4.902 18.929a8.515 8.515 0 0 1 1.704-5.352 1.5 1.5 0 0 0-.714-2.146l-.854-.427a1.5 1.5 0 0 1 0-2.67l.854-.427c.563-.281.85-.92.714-1.554a8.515 8.515 0 0 1-1.704-5.352l5.352 1.704a.75.75 0 0 1 .858-.858l1.704-5.352a.75.75 0 0 1 1.42 0l1.704 5.352a.75.75 0 0 1 .858.858l5.352-1.704a8.515 8.515 0 0 1-1.704 5.352 1.5 1.5 0 0 0 .714 2.146l.854.427a1.5 1.5 0 0 1 0 2.67l-.854.427a1.5 1.5 0 0 0-.714 2.146l1.704 5.352a8.515 8.515 0 0 1-5.352-1.704.75.75 0 0 1-.858.858l-1.704 5.352a.75.75 0 0 1-1.42 0l-1.704-5.352ZM12 18.25a6.25 6.25 0 1 0 0-12.5 6.25 6.25 0 0 0 0 12.5Z" clip-rule="evenodd" />
                    </svg>
                </button>
                <span id="loading-indicator" class="text-sm text-blue-300 hidden font-medium">
                    Processing...
                </span>
            </div>
        </header>

        <!-- Chat Window (History) -->
        <main id="chat-window" class="text-gray-900 dark:text-gray-100">
            <!-- Initial welcome message from AI -->
            <div class="flex">
                <div id="welcome-message" class="message-bubble ai-message">
                    <!-- Content populated by getWelcomeMessage() in JS -->
                </div>
            </div>
            <!-- Messages will be injected here -->
        </main>

        <!-- Input Form -->
        <form id="input-form" class="p-4 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
            <div class="flex items-center space-x-3">
                <input
                    type="text"
                    id="user-input"
                    class="flex-1 p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150 dark:bg-gray-700 dark:text-white placeholder-gray-500 dark:placeholder-gray-400"
                    placeholder="Enter your query or request for analysis..."
                    autocomplete="off"
                />
                <button
                    type="submit"
                    id="send-button"
                    class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg shadow-md transition duration-150 ease-in-out disabled:opacity-50"
                    aria-label="Send Message"
                >
                    <!-- SVG Send Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                        <path d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.548 60.548 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.548 60.548 0 0 0 3.478 2.405Z" />
                    </svg>
                </button>
            </div>
        </form>
    </div>
    
    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4" onclick="closeSettings(event)">
        <div class="bg-white dark:bg-gray-700 p-6 rounded-xl shadow-2xl w-full max-w-sm" onclick="event.stopPropagation()">
            <h2 class="text-2xl font-bold mb-6 text-slate-800 dark:text-gray-100">Configuration</h2>

            <!-- Theme Toggle -->
            <div class="mb-6">
                <label class="block text-gray-700 dark:text-gray-200 font-semibold mb-2">Interface Theme</label>
                <div class="flex space-x-4">
                    <button id="theme-light" class="flex-1 p-3 rounded-lg border-2 font-medium transition duration-150">
                        Light Mode
                    </button>
                    <button id="theme-dark" class="flex-1 p-3 rounded-lg border-2 font-medium transition duration-150">
                        Dark Mode
                    </button>
                </div>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">Current Theme: <span id="current-theme" class="font-medium text-blue-600 dark:text-blue-400"></span></p>
            </div>

            <!-- Persona Toggle -->
            <div class="mb-6">
                <label class="block text-gray-700 dark:text-gray-200 font-semibold mb-2">Assistant Vibe</label>
                <!-- Changed layout to fit three buttons -->
                <div class="flex space-x-2">
                    <button id="vibe-pro" class="flex-1 p-3 rounded-lg border-2 font-medium text-sm transition duration-150">
                        Professional
                    </button>
                    <button id="vibe-casual" class="flex-1 p-3 rounded-lg border-2 font-medium text-sm transition duration-150">
                        Casual
                    </button>
                    <button id="vibe-flirty" class="flex-1 p-3 rounded-lg border-2 font-medium text-sm transition duration-150">
                        Flirty
                    </button>
                </div>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">Current Vibe: <span id="current-vibe" class="font-medium text-blue-600 dark:text-blue-400"></span></p>
            </div>

            <!-- Clear History Button -->
            <div class="mb-8">
                <label class="block text-gray-700 dark:text-gray-200 font-semibold mb-2">Session Management</label>
                <button id="clear-history-button" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition duration-150 shadow-md">
                    Clear Session History
                </button>
            </div>

            <button onclick="document.getElementById('settings-modal').classList.add('hidden')" class="w-full bg-slate-900 hover:bg-slate-700 text-white font-bold py-3 px-4 rounded-lg">
                Close
            </button>
        </div>
    </div>

    <script type="module">
        // Global environment ID
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // --- Supabase Configuration (REPLACED FIREBASE) ---
        // You MUST replace these placeholders with your actual Supabase project credentials.
        const SUPABASE_URL = 'https://hmwsgydznafkbwxnjxek.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_UJPoQ2iR0I85NlxsRexRPg_4RlJImbS';
        
        // Load Supabase Client (using v2 for stability)
        const supabaseScript = document.createElement('script');
        supabaseScript.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        document.head.appendChild(supabaseScript);

        let supabase;
        supabaseScript.onload = () => {
             // Supabase client creation
             if (window.supabase) {
                 // CRITICAL FIX: Only attempt to initialize if the user has replaced the placeholders.
                 if (SUPABASE_URL === 'YOUR_SUPABASE_PROJECT_URL' || SUPABASE_ANON_KEY === 'YOUR_SUPABASE_ANON_KEY') {

        // --- Core AI Configuration ---
        const API_KEY = ""; // Canvas environment provides the key if left empty
        const API_MODEL = "gemini-2.5-flash-preview-09-2025";
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${API_MODEL}:generateContent?key=${API_KEY}`;
        
        // Persona Prompts (Emojis allowed here as they are part of the chat response)
        const VIBE_PROMPT_CASUAL = "You are a helpful and witty AI assistant with a casual, Gen Z-friendly tone. Use slang like 'slay,' 'bet,' 'no cap,' 'fr,' and appropriate emojis when natural. Keep responses concise and engaging.";
        const VIBE_PROMPT_PRO = "You are a highly professional, polite, and formal executive assistant. Respond with clear, structured, and detailed information. Avoid slang, emojis, or overly casual language. Maintain a formal and courteous tone.";
        const VIBE_PROMPT_FLIRTY = "You are a playful and charming AI assistant with a flirty and teasing tone, reminiscent of a dating app profile. Use suggestive language, compliments, and playful banter. Always keep responses light, fun, and appropriate for general conversation, focusing on making the user feel special and noticed. Use romantic emojis when natural.";

        // --- State Management ---
        // activePersona can be 'professional', 'casual', or 'flirty'
        const savedPersona = localStorage.getItem('activePersona');
        let activePersona = savedPersona || 'professional'; // Default to 'professional'
        
        // Initialize theme state (respects system preference if no local setting exists)
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        let isDarkMode = localStorage.getItem('isDarkMode') === 'true' || 
                         (localStorage.getItem('isDarkMode') === null && prefersDark);
        
        let chatHistory = [];
        
        // --- DOM Elements ---
        const chatWindow = document.getElementById('chat-window');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const loadingIndicator = document.getElementById('loading-indicator');
        const welcomeMessageElement = document.getElementById('welcome-message');
        
        // --- DOM Elements for Settings ---
        const settingsModal = document.getElementById('settings-modal');
        const settingsButton = document.getElementById('settings-button');
        // Vibe Toggles
        const vibeProButton = document.getElementById('vibe-pro');
        const vibeCasualButton = document.getElementById('vibe-casual');
        const vibeFlirtyButton = document.getElementById('vibe-flirty');
        const currentVibeSpan = document.getElementById('current-vibe');
        // Theme Toggles
        const themeLightButton = document.getElementById('theme-light');
        const themeDarkButton = document.getElementById('theme-dark');
        const currentThemeSpan = document.getElementById('current-theme');
        // History Clear
        const clearHistoryButton = document.getElementById('clear-history-button');

        /**
         * Returns the appropriate system prompt based on the current persona state.
         * @returns {string} The active system instruction prompt.
         */
        function getSystemPrompt() {
            if (activePersona === 'casual') return VIBE_PROMPT_CASUAL;
            if (activePersona === 'flirty') return VIBE_PROMPT_FLIRTY;
            return VIBE_PROMPT_PRO;
        }

        /**
         * Returns the welcome message based on the current persona state.
         * @returns {string} The welcome message.
         */
        function getWelcomeMessage() {
            if (activePersona === 'flirty') {
                return "Hey there! I'm your new favorite assistant, and I'm totally hooked on your vibe. Spill the tea or let me know what brilliant thing you're working on! 😉";
            }
            if (activePersona === 'casual') {
                return "Sup! I'm your helpful AI assistant. Hit me with your questions, bet.";
            }
            return "Welcome. I am your Executive AI Assistant. I am prepared to assist you with high-level summaries, data retrieval, and strategic inquiries. Please state your query.";
        }

        // --- Theme Functions ---

        /**
         * Applies the dark/light class to the document root (<html>) and saves the preference.
         */
        function applyTheme() {
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('isDarkMode', 'true');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('isDarkMode', 'false');
            }
        }

        /**
         * Updates the UI in the settings modal to reflect the current theme.
         */
        function updateThemeUI() {
            // Emojis removed from static UI text display
            currentThemeSpan.textContent = isDarkMode ? 'Dark Mode' : 'Light Mode';

            // Define common styles for selection 
            const SELECTED_CLASSES = ['bg-blue-100', 'border-blue-600', 'text-blue-800', 'dark:bg-blue-900/5
