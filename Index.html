<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive AI Assistant</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for better chat aesthetics */
        :root {
            /* Professional color definitions */
            --ai-system-color: #0F172A; /* Slate 900 */
            --user-primary-color: #3B82F6; /* Blue 500 */
            --font-inter: "Inter", sans-serif;
        }

        body {
            font-family: var(--font-inter);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        
        /* Base Dark/Light Theme Setup */
        .light body {
            background-color: #F8FAFC; /* Slate-50 */
        }
        .dark body {
            background-color: #111827; /* Gray-900 */
        }

        /* Main chat container for mobile responsiveness */
        #chat-container {
            width: 100%;
            max-width: 700px; /* INCREASED SIZE HERE */
            height: 90vh;
            display: flex;
            flex-direction: column;
            border-radius: 1.5rem;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Chat window styling */
        #chat-window {
            flex-grow: 1;
            padding: 1.5rem;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* Message bubble styling */
        .message-bubble {
            max-width: 90%;
            padding: 0.8rem 1.2rem;
            border-radius: 1.5rem;
            margin-bottom: 1rem;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        /* User messages (Clean Blue Accent) */
        .user-message {
            background-color: var(--user-primary-color);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0.5rem;
        }

        /* AI messages (Neutral System Output) */
        .ai-message {
            /* Light Mode */
            background-color: #F1F5F9; /* Slate 100 */
            color: #1E293B; /* Slate 800 */
            margin-right: auto;
            border-bottom-left-radius: 0.5rem;
        }
        /* AI messages Dark Mode Override */
        .dark .ai-message {
            background-color: #374151; /* Gray 700 */
            color: #F3F4F6; /* Gray 100 */
        }

        /* Source links styling for AI bubbles */
        .sources-container {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            font-size: 0.7rem;
            line-height: 1.2;
            color: #64748B; /* Slate 500 */
        }
        .dark .sources-container {
             border-top: 1px solid rgba(255, 255, 255, 0.1);
             color: #D1D5DB; /* Gray 300 */
        }
        .sources-container a {
            text-decoration: underline;
            margin-right: 0.5rem;
            font-weight: 500;
        }
        .dark .sources-container a {
             color: #93C5FD; /* Blue 300 */
        }
    </style>
</head>
<!-- Apply base theme classes to body/html -->

    <script type="module">
        // Global variables provided by the environment (needed for boilerplate consistency)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- Core AI Configuration ---
        const API_KEY = "AIzaSyAAyk3AHs1X7CPU9eMJ5mIfLJ7EzXZpQzY"; // Canvas environment provides the key if left empty
        const API_MODEL = "gemini-2.5-flash-preview-09-2025";
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${API_MODEL}:generateContent?key=${API_KEY}`;
        
        // Persona Prompts (Emojis allowed here as they are part of the chat response)
        const VIBE_PROMPT_CASUAL = "You are a helpful and witty AI assistant with a casual, Gen Z-friendly tone. Use slang like 'slay,' 'bet,' 'no cap,' 'fr,' and appropriate emojis when natural. Keep responses concise and engaging.";
        const VIBE_PROMPT_PRO = "You are a highly professional, polite, and formal executive assistant. Respond with clear, structured, and detailed information. Avoid slang, emojis, or overly casual language. Maintain a formal and courteous tone.";
        const VIBE_PROMPT_FLIRTY = "You are a playful and charming AI assistant with a flirty and teasing tone, reminiscent of a dating app profile. Use suggestive language, compliments, and playful banter. Always keep responses light, fun, and appropriate for general conversation, focusing on making the user feel special and noticed. Use romantic emojis when natural.";

        // --- State Management ---
        // activePersona can be 'professional', 'casual', or 'flirty'
        const savedPersona = localStorage.getItem('activePersona');
        let activePersona = savedPersona || 'professional'; // Default to 'professional'
        
        // Initialize theme state (respects system preference if no local setting exists)
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        let isDarkMode = localStorage.getItem('isDarkMode') === 'true' || 
                         (localStorage.getItem('isDarkMode') === null && prefersDark);
        
        let chatHistory = [];
        
        // --- DOM Elements ---
        const chatWindow = document.getElementById('chat-window');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const loadingIndicator = document.getElementById('loading-indicator');
        const welcomeMessageElement = document.getElementById('welcome-message');
        
        // --- DOM Elements for Settings ---
        const settingsModal = document.getElementById('settings-modal');
        const settingsButton = document.getElementById('settings-button');
        // Vibe Toggles
        const vibeProButton = document.getElementById('vibe-pro');
        const vibeCasualButton = document.getElementById('vibe-casual');
        const vibeFlirtyButton = document.getElementById('vibe-flirty');
        const currentVibeSpan = document.getElementById('current-vibe');
        // Theme Toggles
        const themeLightButton = document.getElementById('theme-light');
        const themeDarkButton = document.getElementById('theme-dark');
        const currentThemeSpan = document.getElementById('current-theme');
        // History Clear
        const clearHistoryButton = document.getElementById('clear-history-button');

        /**
         * Returns the appropriate system prompt based on the current persona state.
         * @returns {string} The active system instruction prompt.
         */
        function getSystemPrompt() {
            if (activePersona === 'casual') return VIBE_PROMPT_CASUAL;
            if (activePersona === 'flirty') return VIBE_PROMPT_FLIRTY;
            return VIBE_PROMPT_PRO;
        }

        /**
         * Returns the welcome message based on the current persona state.
         * @returns {string} The welcome message.
         */
        function getWelcomeMessage() {
            if (activePersona === 'flirty') {
                return "Hey there! I'm your new favorite assistant, and I'm totally hooked on your vibe. Spill the tea or let me know what brilliant thing you're working on! 😉";
            }
            if (activePersona === 'casual') {
                return "Sup! I'm your helpful AI assistant. Hit me with your questions, bet.";
            }
            return "Welcome. I am your Executive AI Assistant. I am prepared to assist you with high-level summaries, data retrieval, and strategic inquiries. Please state your query.";
        }

        // --- Theme Functions ---

        /**
         * Applies the dark/light class to the document root (<html>) and saves the preference.
         */
        function applyTheme() {
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('isDarkMode', 'true');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('isDarkMode', 'false');
            }
        }

        /**
         * Updates the UI in the settings modal to reflect the current theme.
         */
        function updateThemeUI() {
            // Emojis removed from static UI text display
            currentThemeSpan.textContent = isDarkMode ? 'Dark Mode' : 'Light Mode';

            // Define common styles for selection 
            const SELECTED_CLASSES = ['bg-blue-100', 'border-blue-600', 'text-blue-800', 'dark:bg-blue-900/50', 'dark:border-blue-500', 'dark:text-blue-300'];
            const UNSELECTED_CLASSES = ['bg-gray-50', 'border-gray-300', 'text-gray-700', 'dark:bg-gray-800', 'dark:border-gray-600', 'dark:text-gray-300'];

            // Clean Slate
            [themeLightButton, themeDarkButton].forEach(btn => {
                btn.classList.remove(...SELECTED_CLASSES, ...UNSELECTED_CLASSES);
            });

            // Apply selected style
            if (!isDarkMode) {
                themeLightButton.classList.add(...SELECTED_CLASSES); 
                themeDarkButton.classList.add(...UNSELECTED_CLASSES);
            } else {
                themeDarkButton.classList.add(...SELECTED_CLASSES);
                themeLightButton.classList.add(...UNSELECTED_CLASSES);
            }
        }
        
        /**
         * Toggles the theme and saves the preference.
         * @param {boolean} dark - True for Dark Mode, False for Light Mode.
         */
        function toggleTheme(dark) {
            isDarkMode = dark;
            applyTheme();
            updateThemeUI();
            
            // Emojis ALLOWED in chat response
            const newThemeMessage = isDarkMode 
                ? "🌙 Interface theme set to Dark Mode. Optimal for low-light environments."
                : "☀️ Interface theme set to Light Mode. High-contrast display applied.";
            addMessage(newThemeMessage, 'model');
        }

        // --- Persona Functions ---

        /**
         * Updates the UI in the settings modal to reflect the current persona.
         */
        function updatePersonaUI() {
            currentVibeSpan.textContent = activePersona.charAt(0).toUpperCase() + activePersona.slice(1);

            const SELECTED_CLASSES = ['bg-blue-100', 'border-blue-600', 'text-blue-800', 'dark:bg-blue-900/50', 'dark:border-blue-500', 'dark:text-blue-300'];
            const UNSELECTED_CLASSES = ['bg-gray-50', 'border-gray-300', 'text-gray-700', 'dark:bg-gray-800', 'dark:border-gray-600', 'dark:text-gray-300'];

            // Clean Slate
            [vibeProButton, vibeCasualButton, vibeFlirtyButton].forEach(btn => {
                 btn.classList.remove(...SELECTED_CLASSES, ...UNSELECTED_CLASSES);
            });

            // Apply selected style
            const buttons = {
                'professional': vibeProButton,
                'casual': vibeCasualButton,
                'flirty': vibeFlirtyButton
            };

            for (const persona in buttons) {
                if (activePersona === persona) {
                    buttons[persona].classList.add(...SELECTED_CLASSES);
                } else {
                    buttons[persona].classList.add(...UNSELECTED_CLASSES);
                }
            }
        }
        
        /**
         * Toggles the assistant persona and saves the preference.
         * @param {string} newPersona - 'professional', 'casual', or 'flirty'.
         */
        function togglePersona(newPersona) {
            activePersona = newPersona;
            localStorage.setItem('activePersona', activePersona);
            updatePersonaUI();
            
            let newVibeMessage = '';
            if (activePersona === 'flirty') {
                newVibeMessage = "💖 Swapping over to Flirty mode! Ready to give you all my attention. What's on your mind, gorgeous? 😉";
            } else if (activePersona === 'casual') {
                newVibeMessage = "🤙 Vibe Check: Switched to Casual. Ready to serve the tea, no cap."; 
            } else {
                newVibeMessage = "👔 Persona updated to Professional. Commencing formal operational procedures.";
            }

            addMessage(newVibeMessage, 'model');
        }

        // --- History Function ---

        /**
         * Clears all messages from the history array and the chat UI (except for the initial welcome).
         */
        function clearChatHistory() {
            // 1. Clear history array
            chatHistory = [];
            
            // 2. Clear UI, keeping only the first child (the welcome message container)
            const chatChildren = Array.from(chatWindow.children);
            if (chatChildren.length > 0) {
                // Remove all children except the first one (the welcome message)
                for (let i = 1; i < chatChildren.length; i++) {
                    chatWindow.removeChild(chatChildren[i]);
                }
            }
            
            // Close the settings modal
            settingsModal.classList.add('hidden');
            
            // Emojis ALLOWED in chat response
            let confirmationMessage = "Session history has been cleared. How may I be of assistance?";
            if (activePersona === 'casual') {
                confirmationMessage = "Bet! History is scrubbed. What's the new main quest?";
            } else if (activePersona === 'flirty') {
                confirmationMessage = "History is wiped clean! A fresh start just for us. What's our next adventure together? ✨";
            }

            addMessage(confirmationMessage, 'model');
        }

        /**
         * Updates both Persona and Theme UI elements in the settings modal.
         */
        function updateSettingsUI() {
            updatePersonaUI();
            updateThemeUI();
        }

        /**
         * Adds a message bubble to the chat window.
         * @param {string} text The message content.
         * @param {string} role 'user' or 'model'.
         * @param {Array<Object>} [sources=[]] Optional array of citation sources.
         */
        function addMessage(text, role, sources = []) {
            const messageContainer = document.createElement('div');
            messageContainer.classList.add('flex', role === 'user' ? 'justify-end' : 'justify-start');

            const messageBubble = document.createElement('div');
            messageBubble.classList.add(
                'message-bubble',
                role === 'user' ? 'user-message' : 'ai-message'
            );
            
            // Insert the text content
            messageBubble.innerHTML = text; 

            // Add sources if available and it's an AI message
            if (role === 'model' && sources.length > 0) {
                const sourcesDiv = document.createElement('div');
                sourcesDiv.classList.add('sources-container');
                sourcesDiv.innerHTML = 'Sources: ';
                
                sources.slice(0, 3).forEach((source, index) => { // Limit to 3 sources for brevity
                    const link = document.createElement('a');
                    link.href = source.uri;
                    link.target = '_blank';
                    link.textContent = `${index + 1}. ${source.title || new URL(source.uri).hostname}`;
                    
                    const sourceItem = document.createElement('span');
                    sourceItem.classList.add('mr-2');
                    sourceItem.appendChild(link);
                    sourcesDiv.appendChild(sourceItem);
                });
                messageBubble.appendChild(sourcesDiv);
            }

            messageContainer.appendChild(messageBubble);
            chatWindow.appendChild(messageContainer);
            
            // Scroll to the latest message
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        /**
         * Fetches response from the Gemini API with exponential backoff.
         * @param {Array<Object>} history The conversation history to send.
         * @param {number} retries Current retry count.
         * @returns {Promise<Object>} The parsed JSON response.
         */
        async function fetchGeminiResponse(history, retries = 0) {
            const maxRetries = 5;
            const delay = Math.pow(2, retries) * 1000 + (Math.random() * 1000); // Exponential backoff + jitter

            try {
                const payload = {
                    contents: history,
                    // MANDATORY: Enable Google Search Grounding
                    tools: [{ "google_search": {} }],
                    systemInstruction: {
                        parts: [{ text: getSystemPrompt() }] // Using dynamic persona prompt
                    },
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.status === 429 && retries < maxRetries) {
                    // Too Many Requests, retry
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchGeminiResponse(history, retries + 1);
                }

                if (!response.ok) {
                    const errorBody = await response.text();
                    throw new Error(`API Error: ${response.status} - ${errorBody}`);
                }

                return await response.json();

            } catch (error) {
                if (retries < maxRetries) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchGeminiResponse(history, retries + 1);
                }
                console.error("Failed to fetch response after multiple retries:", error);
                throw new Error("API Connection Failure: Unable to establish contact with the AI service. Please check system logs for details.");
            }
        }

        /**
         * Handles sending the message and processing the AI response.
         */
        async function sendMessage(event) {
            event.preventDefault();
            const prompt = userInput.value.trim();
            if (!prompt) return;

            // 1. Disable UI and show loading
            userInput.value = '';
            sendButton.disabled = true;
            loadingIndicator.classList.remove('hidden');

            // 2. Add user message to UI and history
            addMessage(prompt, 'user');
            chatHistory.push({ role: 'user', parts: [{ text: prompt }] });
            
            // Use a temporary variable for the history sent to the API to handle short-term context
            const historyForApi = [...chatHistory]; 

            try {
                // 3. Call Gemini API
                const result = await fetchGeminiResponse(historyForApi);
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const text = candidate.content.parts[0].text;
                    let sources = [];
                    
                    // Extract Grounding Sources (Citations)
                    const groundingMetadata = candidate.groundingMetadata;
                    if (groundingMetadata && groundingMetadata.groundingAttributions) {
                        sources = groundingMetadata.groundingAttributions
                            .map(attribution => ({
                                uri: attribution.web?.uri,
                                title: attribution.web?.title,
                            }))
                            .filter(source => source.uri); // Ensure sources are valid
                    }

                    // 4. Add AI message to UI and history
                    addMessage(text, 'model', sources);
                    chatHistory.push({ role: 'model', parts: [{ text: text }] });

                } else {
                    addMessage("Error: The AI response structure was incomplete or malformed. Please try rephrasing your request.", 'model');
                    console.error("Gemini response was malformed or empty:", result);
                }

            } catch (error) {
                console.error("Operational Error during API call:", error);
                // 5. Display error message
                addMessage(`Critical Error: ${error.message.split(' - ')[0]}`, 'model');
                // Remove the last user message from history so retrying doesn't duplicate the query
                chatHistory.pop(); 
            } finally {
                // 6. Re-enable UI
                sendButton.disabled = false;
                loadingIndicator.classList.add('hidden');
                userInput.focus();
            }
        }

        // --- Settings Event Handlers ---
        settingsButton.addEventListener('click', () => {
            updateSettingsUI(); // Refresh UI before opening
            settingsModal.classList.remove('hidden');
        });

        vibeProButton.addEventListener('click', () => togglePersona('professional'));
        vibeCasualButton.addEventListener('click', () => togglePersona('casual'));
        vibeFlirtyButton.addEventListener('click', () => togglePersona('flirty'));

        themeLightButton.addEventListener('click', () => toggleTheme(false));
        themeDarkButton.addEventListener('click', () => toggleTheme(true));
        
        clearHistoryButton.addEventListener('click', clearChatHistory);

        // Click outside modal to close
        function closeSettings(event) {
            if (event.target === settingsModal) {
                settingsModal.classList.add('hidden');
            }
        }
        window.closeSettings = closeSettings; // Expose to global scope for HTML onclick

        // --- Initializers ---
        inputForm.addEventListener('submit', sendMessage);
        
        // Apply theme, update UI elements, and set the initial welcome message on load
        applyTheme(); 
        updateSettingsUI(); 
        welcomeMessageElement.innerHTML = getWelcomeMessage();

        console.log(`App ID: ${appId}`);

    </script>
</body>
</html>
